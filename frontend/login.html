
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AgriSmart</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #f5fff5);
            color: #20352a;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 8px 30px #174b2518;
        }
        h1 { color: #24723b; margin-bottom: 8px; }
        p { color: #657368; }
        label { display: block; margin-top: 16px; font-weight: bold; }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccd8ce;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: 0;
            border-radius: 8px;
            background: #24723b;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        #message { margin-top: 16px; overflow-wrap: anywhere; }
        a { color: #24723b; }
        .back { display: block; margin-top: 20px; text-align: center; }
        
/* AgriSmart login page polish */

.card {
    border: 1px solid #e2eee4;
    border-radius: 22px;
    box-shadow: 0 18px 50px rgba(21, 86, 55, 0.12);
}

.card h1,
.card h2 {
    color: #1d6035;
    letter-spacing: -0.4px;
}

.card input {
    width: 100%;
    min-height: 46px;
    padding: 12px 14px;
    border: 1px solid #d5e5d8;
    border-radius: 10px;
    background: #fbfdfb;
    box-sizing: border-box;
}

.card input:focus {
    outline: none;
    border-color: #248a4d;
    box-shadow: 0 0 0 3px rgba(36, 138, 77, 0.12);
}

.card button {
    min-height: 46px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
}

.card a {
    transition: color 0.2s ease;
}

@media (max-width: 480px) {
    body {
        padding: 16px;
    }

    .card {
        padding: 26px 20px;
    }
}

/* AgriSmart Professional Login Design */
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #eaf7e9, #d1ebd3, #f7fbf5);
}

.card {
    border: 1px solid #e0eee0;
    border-radius: 22px;
    box-shadow: 0 18px 50px rgba(35, 90, 48, 0.12);
    padding: 35px;
    transition: box-shadow 0.3s ease;
}

.card:hover {
    box-shadow: 0 22px 55px rgba(35, 90, 48, 0.18);
}

input {
    border: 1px solid #d8e5d8;
    border-radius: 12px;
    padding: 13px;
    transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus {
    outline: none;
    border-color: #37864b;
    box-shadow: 0 0 0 3px rgba(55, 134, 75, 0.12);
}

button {
    border-radius: 12px;
    font-weight: 600;
    transition: transform 0.2s, background 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

@media (max-width: 480px) {
    .card {
        width: 90%;
        padding: 24px;
        box-sizing: border-box;
    }
}

    </style>
</head>
<body>
    <main class="card">
        <h1>🌱 AgriSmart</h1>
        <p>Login to your farmer account</p>

        <form id="loginForm">
            <label for="email">Email address</label>
            <input id="email" type="email" required autocomplete="email">

            <label for="password">Password</label>
            <input id="password" type="password" required
                   autocomplete="current-password">

            <button type="submit" id="loginButton">Login</button>
        </form>

        <p id="message" role="status"></p>

        <p>New to AgriSmart? <a href="/signup">Create an account</a></p>
        <a class="back" href="/">← Continue as Guest</a>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const button = document.getElementById("loginButton");
            const message = document.getElementById("message");
            button.disabled = true;
            message.textContent = "Logging in...";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim(),
                        password: document.getElementById("password").value
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    message.textContent = "Login successful! Opening AgriSmart...";
                    window.location.href = "/dashboard";
                } else {
                    message.textContent = data.message || "Login failed. Please try again.";
                }
            } catch (error) {
                message.textContent = "Could not connect. Please make sure the AgriSmart server is running.";
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
