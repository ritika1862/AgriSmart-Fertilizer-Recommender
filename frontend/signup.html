
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | AgriSmart</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #f5fff5);
            color: #20352a;
        }
        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 30px #174b2518;
        }
        h1 { color: #24723b; margin-bottom: 8px; }
        p { color: #657368; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccd8ce;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: 0;
            border-radius: 8px;
            background: #24723b;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; }
        #message { margin-top: 14px; overflow-wrap: anywhere; }
        a { color: #24723b; }
        .back { display: block; margin-top: 18px; text-align: center; }
        
/* AgriSmart signup page polish */

.card {
    border: 1px solid #e2eee4;
    border-radius: 22px;
    box-shadow: 0 18px 50px rgba(21, 86, 55, 0.12);
}

.card h1,
.card h2 {
    color: #1d6035;
    letter-spacing: -0.4px;
}

.card input,
.card select {
    width: 100%;
    min-height: 46px;
    padding: 12px 14px;
    border: 1px solid #d5e5d8;
    border-radius: 10px;
    background: #fbfdfb;
    box-sizing: border-box;
}

.card input:focus,
.card select:focus {
    outline: none;
    border-color: #248a4d;
    box-shadow: 0 0 0 3px rgba(36, 138, 77, 0.12);
}

.card button {
    min-height: 46px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
}

.card a {
    transition: color 0.2s ease;
}

@media (max-width: 480px) {
    body {
        padding: 16px;
    }

    .card {
        padding: 26px 20px;
    }
}

/* AgriSmart Signup - Professional Styling */
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #eaf7e9, #d1ebd3, #f7fbf5);
}

.card {
    border: 1px solid #e0eee0;
    border-radius: 22px;
    box-shadow: 0 18px 50px rgba(35, 90, 48, 0.12);
    padding: 32px;
}

input, select {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #d8e5d8;
    border-radius: 11px;
    padding: 13px;
    background: #fff;
    font: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus, select:focus {
    outline: 2px solid #37864b;
    outline-offset: 1px;
    border-color: #37864b;
}

button {
    border-radius: 12px;
    font-weight: 600;
    transition: transform 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

a {
    color: #267440;
}

@media (max-width: 480px) {
    .card {
        width: 92%;
        padding: 22px;
        box-sizing: border-box;
    }
}

    </style>
</head>
<body>
    <main class="card">
        <h1>🌱 Join AgriSmart</h1>
        <p>Create your farmer account</p>

        <form id="signupForm">
            <label for="name">Full name *</label>
            <input id="name" type="text" required maxlength="100"
                   autocomplete="name">

            <label for="email">Email address *</label>
            <input id="email" type="email" required maxlength="254"
                   autocomplete="email">

            <label for="password">Password *</label>
            <input id="password" type="password" required minlength="6"
                   autocomplete="new-password"
                   placeholder="At least 6 characters">

            <label for="phone">Phone number</label>
            <input id="phone" type="tel" maxlength="20"
                   autocomplete="tel" placeholder="Optional">

            <label for="state">State</label>
            <select id="state">
                <option value="">Select your state (optional)</option>
                <option>Punjab</option>
                <option>Haryana</option>
                <option>Himachal Pradesh</option>
                <option>Rajasthan</option>
                <option>Uttar Pradesh</option>
                <option>Delhi</option>
                <option>Madhya Pradesh</option>
                <option>Maharashtra</option>
                <option>Gujarat</option>
                <option>Other</option>
            </select>

            <button type="submit" id="signupButton">Create Account</button>
        </form>

        <p id="message" role="status"></p>
        <p>Already registered? <a href="/login">Login here</a></p>
        <a class="back" href="/">← Continue as Guest</a>
    </main>

    <script>
        document.getElementById("signupForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const button = document.getElementById("signupButton");
            const message = document.getElementById("message");
            button.disabled = true;
            message.textContent = "Creating your account...";

            try {
                const response = await fetch("/api/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        name: document.getElementById("name").value.trim(),
                        email: document.getElementById("email").value.trim(),
                        password: document.getElementById("password").value,
                        phone: document.getElementById("phone").value.trim(),
                        state: document.getElementById("state").value
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    message.textContent = "Account created! Opening your dashboard...";
                    window.location.href = "/dashboard";
                } else {
                    message.textContent = data.message || "Could not create account. Please try again.";
                }
            } catch (error) {
                message.textContent = "Could not connect. Please check that AgriSmart is running.";
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
